// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
      ndkVersion = "27.1.12297006"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  
  afterEvaluate { project ->
      if (project.hasProperty('java')) {
          project.java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(23)
              }
          }
      }
      if (project.hasProperty('android')) {
          if (project.android.hasProperty('externalNativeBuild') && project.android.externalNativeBuild.hasProperty('cmake')) {
              project.android.externalNativeBuild.cmake.version = "3.30.5"
              project.android.externalNativeBuild.cmake.buildStagingDirectory = new File("C:/F/cxx/${project.name}")
          }
          project.android.ndkVersion = "27.1.12297006"
      }
      project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile.class).configureEach {
          kotlinOptions {
              jvmTarget = "17"
          }
      }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
